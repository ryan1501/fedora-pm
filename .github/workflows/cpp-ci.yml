name: C++ migration CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cpp-migration-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ubuntu-build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install C++ and Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ qt6-base-dev rpm desktop-file-utils

      - name: Configure
        run: cmake -S . -B build -DFEDORAPM_BUILD_GUI=ON -DFEDORAPM_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build CLI, GUI, and tests
        run: cmake --build build --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test CLI help and self-update compatibility
        run: |
          ./build/fedora-pm help
          test "$(./build/fedora-pm --version)" = "fedora-pm 2.0.0"
          test "$(./build/fedora-pm -V)" = "fedora-pm 2.0.0"
          test "$(./build/fedora-pm version)" = "fedora-pm 2.0.0"
          ./build/fedora-pm self-update status
          if ./build/fedora-pm self-update update --force --quiet; then
            echo "Unconfigured self-update unexpectedly reported success" >&2
            exit 1
          fi
          if ./build/fedora-pm self-update enable daily; then
            echo "Unimplemented automatic self-update unexpectedly reported success" >&2
            exit 1
          fi
          if ./build/fedora-pm self-update disable; then
            echo "Unimplemented automatic self-update unexpectedly reported success" >&2
            exit 1
          fi
          if ./build/fedora-pm self-update update --unknown; then
            echo "Unknown self-update option unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Check CLI usage errors
        run: |
          expect_usage_error() {
            set +e
            "$@" >/dev/null 2>&1
            status=$?
            set -e
            if [ "$status" -ne 2 ]; then
              echo "Expected usage error (exit 2): $*" >&2
              exit 1
            fi
          }
          # Invalid flags must never be silently ignored by system-mutating commands.
          expect_usage_error ./build/fedora-pm nvidia-remove --bogus
          expect_usage_error ./build/fedora-pm cuda-install --bogus
          expect_usage_error ./build/fedora-pm gaming-install --bogus
          expect_usage_error ./build/fedora-pm rollback-last --bogus
          expect_usage_error ./build/fedora-pm clean-orphans --bogus
          expect_usage_error ./build/fedora-pm flatpak-update --bogus
          expect_usage_error ./build/fedora-pm flatpak-install org.example.App --bogus
          expect_usage_error ./build/fedora-pm flatpak-remove org.example.App --bogus
          # Usage errors should emit actual line breaks, not the literal \\n sequence.
          set +e
          ./build/fedora-pm flatpak-update --bogus 2>usage-error.txt
          usage_status=$?
          set -e
          test "$usage_status" -eq 2
          if grep -F '\n' usage-error.txt; then
            echo "Usage error contains a literal \n instead of a line break" >&2
            exit 1
          fi

      - name: Validate Fedora RPM specs and desktop metadata
        run: |
          rpmspec --parse fedora-pm-rpm.spec >/dev/null
          rpmspec --parse fedora-pm-gui-rpm.spec >/dev/null
          desktop-file-validate fedora-pm.desktop
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('fedora-pm.metainfo.xml')"

  fedora-build-and-test:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install C++ and Qt 6 build dependencies
        run: dnf install --assumeyes git cmake gcc-c++ qt6-qtbase-devel rpm-build desktop-file-utils

      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DFEDORAPM_BUILD_GUI=ON -DFEDORAPM_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build CLI, GUI, and tests
        run: cmake --build build --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test CLI help and self-update compatibility
        run: |
          ./build/fedora-pm help
          test "$(./build/fedora-pm --version)" = "fedora-pm 2.0.0"
          test "$(./build/fedora-pm -V)" = "fedora-pm 2.0.0"
          test "$(./build/fedora-pm version)" = "fedora-pm 2.0.0"
          ./build/fedora-pm self-update status
          if ./build/fedora-pm self-update update --force --quiet; then
            echo "Unconfigured self-update unexpectedly reported success" >&2
            exit 1
          fi
          if ./build/fedora-pm self-update enable daily; then
            echo "Unimplemented automatic self-update unexpectedly reported success" >&2
            exit 1
          fi
          if ./build/fedora-pm self-update disable; then
            echo "Unimplemented automatic self-update unexpectedly reported success" >&2
            exit 1
          fi
          if ./build/fedora-pm self-update update --unknown; then
            echo "Unknown self-update option unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Build CLI and GUI RPMs from this checkout
        run: |
          set -euxo pipefail
          # Use a fresh temporary build tree so old checked-in RPMs can never be selected by find.
          topdir="$RUNNER_TEMP/rpmbuild"
          rm -rf "$topdir"
          mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git -c safe.directory="$PWD" archive --format=tar.gz --prefix=fedora-pm-2.0.0/ HEAD > "$topdir/SOURCES/fedora-pm-2.0.0.tar.gz"
          cp fedora-pm-rpm.spec fedora-pm-gui-rpm.spec "$topdir/SPECS/"
          rpmbuild -ba --define "_topdir $topdir" "$topdir/SPECS/fedora-pm-rpm.spec"
          rpmbuild -ba --define "_topdir $topdir" "$topdir/SPECS/fedora-pm-gui-rpm.spec"
          cli_rpm="$(find "$topdir/RPMS" -type f -name 'fedora-pm-[0-9]*.rpm' -print -quit)"
          gui_rpm="$(find "$topdir/RPMS" -type f -name 'fedora-pm-gui-[0-9]*.rpm' -print -quit)"
          test -n "$cli_rpm"
          test -n "$gui_rpm"
          # Exercise RPM dependency resolution, install ownership, and clean removal in the disposable Fedora container.
          dnf install --assumeyes "$cli_rpm" "$gui_rpm"
          rpm -q fedora-pm fedora-pm-gui
          test "$(fedora-pm --version)" = "fedora-pm 2.0.0"
          test -x /usr/bin/fedora-pm-gui
          test -f /usr/share/applications/fedora-pm.desktop
          test -f /usr/share/metainfo/fedora-pm.metainfo.xml
          dnf remove --assumeyes fedora-pm fedora-pm-gui
          if rpm -q fedora-pm fedora-pm-gui; then
            echo "RPM packages remained installed after removal" >&2
            exit 1
          fi
          test ! -e /usr/bin/fedora-pm
          test ! -e /usr/bin/fedora-pm-gui
          test ! -e /usr/share/applications/fedora-pm.desktop
          test ! -e /usr/share/metainfo/fedora-pm.metainfo.xml
